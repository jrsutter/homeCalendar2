<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Chores Weather</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

  <style>
    /* General layout styles */
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 0;
    }

    .tabs {
      display: flex;
      background-color: #2c3e50;
      padding: 10px 0;
      justify-content: space-around;
    }

    .tabs div {
      color: #fff;
      padding: 14px 30px;
      cursor: pointer;
      font-size: 18px;
    }

    .tabs div.active {
      background-color: #34495e;
    }

    .tab-content {
      padding: 20px;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Calendar Layout for two columns */
    .calendar-content {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .calendar-column {
      width: 48%;
    }

    /* Chores table */
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border: 1px solid #ddd;
    }

    th {
      background-color: #34495e;
      color: white;
    }

    .assign-button {
      background-color: #2c3e50;
      color: white;
      padding: 5px 10px;
      border: none;
      cursor: pointer;
    }

    .assign-button:hover {
      background-color: #34495e;
    }

    .assigned-person {
      font-weight: bold;
      color: #2ecc71;
    }

    /* Other styles */
    .weather-info {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="tabs">
  <div class="tab" data-tab="calendar">Calendar</div>
  <div class="tab" data-tab="chores">Chores</div>
  <div class="tab" data-tab="weather">Weather</div>
</div>

<div class="tab-content calendar-content active">
  <!-- Calendar Column 1 -->
  <div class="calendar-column">
    <!-- Embed your first calendar here -->

  </div>

  <!-- Calendar Column 2 -->
  <div class="calendar-column">
    <!-- Embed your second calendar here -->
    <iframe src=""https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=America%2FChicago&showPrint=0&showTitle=0&src=amFycmV0dHN1dHRlckBnbWFpbC5jb20&src=Y2E3MDdkMTY5OTViZmU0NjdlMGMwYTlmYzQ3ZGUwYmZhYTBmYTVkOGUzMzJhOTZlNDRiNzI5MTBiZTdjYzUzZkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&src=Y184YjVkOWFhN2UyOTM0YzZhMDBmMzBmODliY2ViODU0NzdiOTMwNWNmZTE3MWUxMGJlOWM4NzNjZDRkZjIzOWU4QGdyb3VwLmNhbGVuZGFyLmdvb2dsZS5jb20&src=ZW4udXNhI2hvbGlkYXlAZ3JvdXAudi5jYWxlbmRhci5nb29nbGUuY29t&src=dHEzc2ZwaXQ4aW1qNGIwOGJ0YnFvY2NlNnF0dXI3MzlAaW1wb3J0LmNhbGVuZGFyLmdvb2dsZS5jb20&src=bGF1cmljZXN1dHRlckBnbWFpbC5jb20&color=%233F51B5&color=%23AD1457&color=%234285F4&color=%23009688&color=%237CB342&color=%239E69AF" style="border:solid 1px #777" width="100%" height="600" frameborder="0" scrolling="no"></iframe>
  </div>
</div>

<div class="tab-content chores-content">
  <!-- Chores content: Add chore functionality and table for chore management -->
  <div class="task-input">
    <input type="text" id="choreName" placeholder="Enter new chore" />
    <button onclick="addChore()">Add Chore</button>
  </div>
  <table id="choresTable">
    <thead>
      <tr>
        <th>Chore</th>
        <th>Assign</th>
        <th>Sunday</th>
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
        <th>Thursday</th>
        <th>Friday</th>
        <th>Saturday</th>
        <th>Options</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div class="tab-content weather-content">
  <div class="weather-info">
    <h2>Weather in Your Area</h2>
    <div id="currentWeather"></div>
    <div class="weather-row" id="hourlyForecast"></div>
    <div class="weather-row" id="forecastRow"></div>
  </div>
</div>

<script>
  // Switch between tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      const targetTab = tab.getAttribute('data-tab');
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
        if (content.classList.contains(`${targetTab}-content`)) {
          content.classList.add('active');
        }
      });
    });
  });

  // Weather API call and display
  const weatherApiKey = 'a0df3a129b9aae7b8aab104f4eca575a';
  const lat = 30.214718;
  const lon = 95.434769;

  function fetchWeather() {
    fetch(`https://api.openweathermap.org/data/2.5/onecall?lat=${lat}&lon=${lon}&exclude=minutely&units=imperial&appid=${weatherApiKey}`)
      .then(response => response.json())
      .then(data => {
        const currentWeather = data.current;
        const hourlyForecast = data.hourly.slice(0, 4); // Next 12 hours (3-hour intervals)
        const forecast = data.daily;

        const currentTemp = currentWeather.temp;
        const currentDescription = currentWeather.weather[0].description;
        const currentIcon = `https://openweathermap.org/img/wn/${currentWeather.weather[0].icon}@2x.png`;

        document.getElementById('currentWeather').innerHTML = `
          <div><strong>Current Temp:</strong> ${currentTemp}°F</div>
          <div><strong>Conditions:</strong> ${currentDescription}</div>
          <img src="${currentIcon}" alt="Weather Icon" class="weather-icon">
        `;

        // Hourly forecast (3-hour increments)
        let hourlyHtml = '';
        hourlyForecast.forEach(hour => {
          const hourTime = new Date(hour.dt * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const temp = hour.temp;
          const iconUrl = `https://openweathermap.org/img/wn/${hour.weather[0].icon}@2x.png`;
          
          hourlyHtml += `
            <div class="weather-card">
              <div><strong>${hourTime}</strong></div>
              <img class="weather-icon" src="${iconUrl}" alt="${hour.weather[0].description}">
              <div><strong>Temp:</strong> ${temp}°F</div>
            </div>
          `;
        });

        document.getElementById('hourlyForecast').innerHTML = hourlyHtml;

        // 5-day forecast
        let forecastHtml = '';
        forecast.forEach(day => {
          const dayName = new Date(day.dt * 1000).toLocaleString('en', { weekday: 'long' });
          const highTemp = day.temp.max;
          const lowTemp = day.temp.min;
          const windSpeed = day.wind_speed;
          const rainChance = day.pop * 100;
          const iconUrl = `https://openweathermap.org/img/wn/${day.weather[0].icon}@2x.png`;

          forecastHtml += `
            <div class="weather-card">
              <div><strong>${dayName}</strong></div>
              <img class="weather-icon" src="${iconUrl}" alt="${day.weather[0].description}">
              <div><strong>High:</strong> ${highTemp}°F</div>
              <div><strong>Low:</strong> ${lowTemp}°F</div>
              <div><strong>Wind:</strong> ${windSpeed} mph</div>
              <div><strong>Rain:</strong> ${rainChance}%</div>
            </div>
          `;
        });

        document.getElementById('forecastRow').innerHTML = forecastHtml;
      })
      .catch(error => {
        console.log('Weather data failed to load', error);
      });
  }

  // Initial weather load
  fetchWeather();

  // Chore functionality
  const chores = [];

  function addChore() {
    const choreName = document.getElementById('choreName').value;
    if (choreName.trim()) {
      const chore = {
        name: choreName,
        assignedTo: null, // Will hold the name of the assigned person
        days: []
      };
      chores.push(chore);
      renderChores();
    }
    document.getElementById('choreName').value = '';
  }

  function renderChores() {
    const tableBody = document.querySelector('#choresTable tbody');
    tableBody.innerHTML = '';
    chores.forEach((chore, index) => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${chore.name}</td>
        <td><button class="assign-button" onclick="assignChore(${index})">Assign</button></td>
        <td>${chore.assignedTo ? `<span class="assigned-person">${chore.assignedTo}</span>` : 'Not Assigned'}</td>
        <td><input type="checkbox" onclick="toggleChore(${index}, 'sunday')"></td>
        <td><input type="checkbox" onclick="toggleChore(${index}, 'monday')"></td>
        <td><input type="checkbox" onclick="toggleChore(${index}, 'tuesday')"></td>
        <td><input type="checkbox" onclick="toggleChore(${index}, 'wednesday')"></td>
        <td><input type="checkbox" onclick="toggleChore(${index}, 'thursday')"></td>
        <td><input type="checkbox" onclick="toggleChore(${index}, 'friday')"></td>
        <td><input type="checkbox" onclick="toggleChore(${index}, 'saturday')"></td>
        <td><button onclick="deleteChore(${index})">Delete</button></td>
      `;
      tableBody.appendChild(row);
    });
  }

  function assignChore(index) {
    const assignedPerson = prompt('Assign to (Jarrett or Laurice):');
    if (assignedPerson && (assignedPerson.toLowerCase() === 'jarrett' || assignedPerson.toLowerCase() === 'laurice')) {
      chores[index].assignedTo = assignedPerson.charAt(0).toUpperCase() + assignedPerson.slice(1); // Capitalize first letter
      renderChores();
    } else {
      alert('Please choose either "Jarrett" or "Laurice".');
    }
  }

  function toggleChore(index, day) {
    chores[index].days.includes(day)
      ? chores[index].days = chores[index].days.filter(d => d !== day)
      : chores[index].days.push(day);
  }

  function deleteChore(index) {
    chores.splice(index, 1);
    renderChores();
  }
</script>

</body>
</html>
