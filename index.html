<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .tabs {
      display: flex;
      background: #333;
      color: white;
    }
    .tab-button {
      flex: 1;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      background: #444;
    }
    .tab-button.active {
      background: #666;
    }
    .tab-content {
      display: none;
      padding: 20px;
    }
    .tab-content.active {
      display: block;
    }
    .calendar-container {
      display: flex;
      gap: 10px;
    }
    iframe {
      border: none;
    }
    .chore-form input,
    .chore-form select {
      margin-right: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    table, th, td {
      border: 1px solid black;
    }
    th, td {
      padding: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <div class="tab-button active" onclick="switchTab('calendar')">Calendar</div>
    <div class="tab-button" onclick="switchTab('chores')">Chores</div>
    <div class="tab-button" onclick="switchTab('weather')">Weather</div>
  </div>

  <div id="calendar" class="tab-content active">
    <h2>Calendar</h2>
    <div class="calendar-container">
      <iframe src="https://calendar.google.com/calendar/embed?src=YOUR_AGENDA_VIEW_ID&mode=agenda" style="flex:1; height: 600px;"></iframe>
      <iframe src="https://calendar.google.com/calendar/embed?src=YOUR_MONTH_VIEW_ID&mode=month" style="flex:1; height: 600px;"></iframe>
    </div>
  </div>

  <div id="chores" class="tab-content">
    <h2>Chores</h2>
    <form class="chore-form" onsubmit="addChore(event)">
      <input type="text" id="chore-name" placeholder="Chore name" required />
      <select id="chore-person">
        <option value="Jarrett">Jarrett</option>
        <option value="Laurice">Laurice</option>
      </select>
      <select id="chore-day">
        <option>Sunday</option><option>Monday</option><option>Tuesday</option>
        <option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option>
      </select>
      <button type="submit">Add Chore</button>
    </form>
    <table id="chore-table">
      <thead>
        <tr>
          <th>Person</th>
          <th>Sunday</th>
          <th>Monday</th>
          <th>Tuesday</th>
          <th>Wednesday</th>
          <th>Thursday</th>
          <th>Friday</th>
          <th>Saturday</th>
        </tr>
      </thead>
      <tbody id="chore-body"></tbody>
    </table>
  </div>

  <div id="weather" class="tab-content">
    <h2>Weather</h2>
    <div id="hourly-weather"></div>
    <div id="daily-weather"></div>
  </div>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelector(`[onclick="switchTab('${tabId}')"]`).classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function addChore(e) {
      e.preventDefault();
      const name = document.getElementById('chore-name').value;
      const person = document.getElementById('chore-person').value;
      const day = document.getElementById('chore-day').value;

      let row = document.querySelector(`#chore-body tr[data-person='${person}']`);
      if (!row) {
        row = document.createElement('tr');
        row.setAttribute('data-person', person);
        row.innerHTML = `<td>${person}</td>` + '<td></td>'.repeat(7);
        document.getElementById('chore-body').appendChild(row);
      }

      const dayIndex = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'].indexOf(day);
      row.cells[dayIndex + 1].innerHTML += `<div><input type="checkbox"> ${name}</div>`;
    }

    const apiKey = "a0df3a129b9aae7b8aab104f4eca575a";
    const lat = 30.214718;
    const lon = -95.434769;
    fetch(`https://api.openweathermap.org/data/2.5/onecall?lat=${lat}&lon=${lon}&units=imperial&appid=${apiKey}`)
      .then(response => response.json())
      .then(data => {
        const hourly = data.hourly.slice(0, 6);
        const daily = data.daily.slice(0, 5);

        let hourlyHTML = '<h3>Next 6 Hours</h3><ul>';
        hourly.forEach(hour => {
          const time = new Date(hour.dt * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          hourlyHTML += `<li>${time}: ${hour.temp}°F, Rain: ${Math.round(hour.pop * 100)}%</li>`;
        });
        hourlyHTML += '</ul>';
        document.getElementById('hourly-weather').innerHTML = hourlyHTML;

        let dailyHTML = '<h3>Next 5 Days</h3><ul>';
        daily.forEach(day => {
          const date = new Date(day.dt * 1000).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
          dailyHTML += `<li>${date}: Day ${day.temp.day}°F / Night ${day.temp.night}°F - ${day.weather[0].description}, Rain: ${Math.round(day.pop * 100)}%</li>`;
        });
        dailyHTML += '</ul>';
        document.getElementById('daily-weather').innerHTML = dailyHTML;
      });
  </script>
</body>
</html>
