<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <style>
    body { font-family: Arial; margin: 0; }
    nav { display: flex; background: #333; }
    nav div {
      flex: 1;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      color: white;
    }
    nav div.active { background: #555; }
    .tab-content { display: none; padding: 20px; }
    .tab-content.active { display: block; }
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 6px;
    }
    #calendar-container {
      display: flex;
      gap: 20px;
    }
    iframe { width: 100%; border: none; height: 600px; }
    .weather-container {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .weather-row {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: space-around;
  margin-top: 20px;
}
 .weather-icon {
  background: rgba(255,255,255,0.85);
  border-radius: 50%;
  padding: 6px;
  width: 80px;
  height: 80px;
  object-fit: contain;
}

    .weather-card:hover {
  transform: scale(1.05);
  transition: 0.2s ease;
}
    
    .weather-icon {
      width: 80px;
      height: 80px;
    }
  </style>
</head>
<body>

<h2 style="text-align:center">Dashboard</h2>
<nav>
  <div onclick="showTab('calendar')">Calendar</div>
  <div onclick="showTab('chores')">Chores</div>
  <div onclick="showTab('weather')">Weather</div>
</nav>

<div class="tab-content" id="calendar">
  <h3>Calendar</h3>
  <div id="calendar-container">
    <iframe src="https://calendar.google.com/calendar/embed?src=your_agenda_calendar_id&mode=AGENDA&ctz=America%2FChicago"></iframe>
    <iframe src="https://calendar.google.com/calendar/embed?src=your_month_calendar_id&mode=MONTH&ctz=America%2FChicago"></iframe>
  </div>
</div>

<div class="tab-content" id="chores">
  <h3>Chores</h3>
  <form id="choreForm">
    Chore Name: <input type="text" id="choreName" required />
    Person:
    <select id="chorePerson">
      <option>Jarrett</option>
      <option>Laurice</option>
    </select>
    Days:
    <label><input type="checkbox" name="day" value="Sunday">Su</label>
    <label><input type="checkbox" name="day" value="Monday">Mo</label>
    <label><input type="checkbox" name="day" value="Tuesday">Tu</label>
    <label><input type="checkbox" name="day" value="Wednesday">We</label>
    <label><input type="checkbox" name="day" value="Thursday">Th</label>
    <label><input type="checkbox" name="day" value="Friday">Fr</label>
    <label><input type="checkbox" name="day" value="Saturday">Sa</label>
    <button type="submit">Add Chore</button>
  </form>

  <br/>
  <button onclick="deleteSelectedChores()">Delete Selected</button>
  <br/><br/>

  <table id="choreTable">
    <thead>
      <tr>
        <th><input type="checkbox" id="selectAll" onclick="toggleAll(this)"></th>
        <th>Person</th>
        <th>Sunday</th><th>Monday</th><th>Tuesday</th><th>Wednesday</th>
        <th>Thursday</th><th>Friday</th><th>Saturday</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div class="tab-content" id="weather">
  <h3>Weather</h3>
  <div id="hourly-weather"></div>
  <hr/>
  <div id="daily-weather"></div>
</div>

<script>
  function showTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('nav div').forEach(d => d.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
  }
  document.querySelector('nav div').click();

  document.getElementById('choreForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('choreName').value;
    const person = document.getElementById('chorePerson').value;
    const days = Array.from(document.querySelectorAll('input[name="day"]:checked')).map(cb => cb.value);

    const row = document.createElement('tr');
    row.innerHTML = `<td><input type="checkbox" class="delete-chore"></td><td>${person}</td>` +
      ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map(day => {
        if (days.includes(day)) {
          return `<td><label><input type="checkbox" onchange="this.nextSibling.style.textDecoration = this.checked ? 'line-through' : 'none'"><span>${name}</span></label></td>`;
        } else {
          return `<td></td>`;
        }
      }).join('');
    document.querySelector('#choreTable tbody').appendChild(row);
    this.reset();
  });

  function deleteSelectedChores() {
    const checkboxes = document.querySelectorAll('.delete-chore:checked');
    checkboxes.forEach(cb => cb.closest('tr').remove());
  }

  function toggleAll(master) {
    const checkboxes = document.querySelectorAll('.delete-chore');
    checkboxes.forEach(cb => cb.checked = master.checked);
  }

  const apiKey = "a0df3a129b9aae7b8aab104f4eca575a";
  const lat = 30.214718, lon = -95.434769;

  function fetchWeather() {
  fetch(`https://api.openweathermap.org/data/2.5/onecall?lat=${lat}&lon=${lon}&exclude=minutely&units=imperial&appid=${weatherApiKey}`)
    .then(response => response.json())
    .then(data => {
      const currentWeather = data.current;
      const forecast = data.daily;
      const hourly = data.hourly.slice(0, 6);  // Get first 6 hours of forecast for today

      const currentTemp = currentWeather.temp;
      const currentDescription = currentWeather.weather[0].description;
      const currentIcon = `https://openweathermap.org/img/wn/${currentWeather.weather[0].icon}@2x.png`;

      document.getElementById('currentWeather').innerHTML = `
        <div><strong>Current Temp:</strong> ${currentTemp}°F</div>
        <div><strong>Conditions:</strong> ${currentDescription}</div>
        <img src="${currentIcon}" alt="Weather Icon" class="weather-icon">
      `;

      // Display 6 hour intervals for today
      let hourlyHTML = '<h4>Today (3-hour intervals)</h4><div class="weather-container">';
      hourly.forEach(entry => {
        const time = new Date(entry.dt * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const icon = entry.weather[0].icon;
        const iconUrl = `https://openweathermap.org/img/wn/${icon}@2x.png`;
        hourlyHTML += `
          <div class="weather-card">
            <div>${time}</div>
            <img class="weather-icon" src="${iconUrl}" alt="${entry.weather[0].description}">
            <div>${entry.temp}°F</div>
            <div>${entry.weather[0].description}</div>
            <div>Rain: ${Math.round(entry.pop * 100)}%</div>
          </div>`;
      });
      hourlyHTML += '</div>';
      document.getElementById('hourly-weather').innerHTML = hourlyHTML;

      // Populate 5-day forecast with additional details
      let forecastHtml = '';
      forecast.forEach(day => {
        const dayName = new Date(day.dt * 1000).toLocaleString('en', { weekday: 'long' });
        const highTemp = day.temp.max;
        const lowTemp = day.temp.min;
        const windSpeed = day.wind_speed;
        const rainChance = day.pop * 100;
        const humidity = day.humidity;
        const pressure = day.pressure;
        const iconUrl = `https://openweathermap.org/img/wn/${day.weather[0].icon}@2x.png`;

        // Convert Unix timestamps for sunrise and sunset to human-readable format
        const sunrise = new Date(day.sunrise * 1000).toLocaleTimeString();
        const sunset = new Date(day.sunset * 1000).toLocaleTimeString();

        forecastHtml += `
          <div class="weather-card">
            <div><strong>${dayName}</strong></div>
            <img class="weather-icon" src="${iconUrl}" alt="${day.weather[0].description}">
            <div><strong>High:</strong> ${highTemp}°F</div>
            <div><strong>Low:</strong> ${lowTemp}°F</div>
            <div><strong>Wind:</strong> ${windSpeed} mph</div>
            <div><strong>Rain:</strong> ${rainChance}%</div>
            <div><strong>Humidity:</strong> ${humidity}%</div>
            <div><strong>Pressure:</strong> ${pressure} hPa</div>
            <div><strong>Sunrise:</strong> ${sunrise}</div>
            <div><strong>Sunset:</strong> ${sunset}</div>
          </div>
        `;
      });

      document.getElementById('forecastRow').innerHTML = forecastHtml;
    })
    .catch(error => {
      console.log('Weather data failed to load', error);
    });
}

      hourlyHTML += '</div>';
      document.getElementById('hourly-weather').innerHTML = hourlyHTML;

      data.list.forEach(entry => {
        const date = new Date(entry.dt * 1000).toLocaleDateString();
        if (!daily[date]) daily[date] = entry;
      });

      let dailyHTML = '<h4>Next 5 Days</h4><div class="weather-container">';
      Object.values(daily).slice(0, 5).forEach(entry => {
        const date = new Date(entry.dt * 1000).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
        const icon = entry.weather[0].icon;
        const iconUrl = `https://openweathermap.org/img/wn/${icon}@2x.png`;
        dailyHTML += `
          <div class="weather-card">
            <div>${date}</div>
            <img class="weather-icon" src="${iconUrl}" alt="${entry.weather[0].description}">
            <div>${entry.main.temp}°F</div>
            <div>${entry.weather[0].description}</div>
            <div>Rain: ${Math.round(entry.pop * 100)}%</div>
          </div>`;
      });
      dailyHTML += '</div>';
      document.getElementById('daily-weather').innerHTML = dailyHTML;
    })
    .catch(err => {
      document.getElementById('hourly-weather').innerText = "Weather data failed to load.";
      console.error(err);
    });
</script>

</body>
</html>
