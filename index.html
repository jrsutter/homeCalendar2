<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <style>
    body { font-family: Arial; margin: 0; }
    nav { display: flex; background: #333; }
    nav div {
      flex: 1;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      color: white;
    }
    nav div.active { background: #555; }
    .tab-content { display: none; padding: 20px; }
    .tab-content.active { display: block; }
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 6px;
    }
    #calendar-container {
      display: flex;
      gap: 20px;
    }
    iframe { width: 100%; border: none; height: 600px; }
  </style>
</head>
<body>

<h2 style="text-align:center">Dashboard</h2>
<nav>
  <div onclick="showTab('calendar')">Calendar</div>
  <div onclick="showTab('chores')">Chores</div>
  <div onclick="showTab('weather')">Weather</div>
</nav>

<div class="tab-content" id="calendar">
  <h3>Calendar</h3>
  <div id="calendar-container">
    <iframe src="https://calendar.google.com/calendar/embed?src=your_agenda_calendar_id&mode=AGENDA&ctz=America%2FChicago"></iframe>
    <iframe src="https://calendar.google.com/calendar/embed?src=your_month_calendar_id&mode=MONTH&ctz=America%2FChicago"></iframe>
  </div>
</div>

<div class="tab-content" id="chores">
  <h3>Chores</h3>
  <form id="choreForm">
    Chore Name: <input type="text" id="choreName" required />
    Person:
    <select id="chorePerson">
      <option>Jarrett</option>
      <option>Laurice</option>
    </select>
    Days:
    <label><input type="checkbox" name="day" value="Sunday">Su</label>
    <label><input type="checkbox" name="day" value="Monday">Mo</label>
    <label><input type="checkbox" name="day" value="Tuesday">Tu</label>
    <label><input type="checkbox" name="day" value="Wednesday">We</label>
    <label><input type="checkbox" name="day" value="Thursday">Th</label>
    <label><input type="checkbox" name="day" value="Friday">Fr</label>
    <label><input type="checkbox" name="day" value="Saturday">Sa</label>
    <button type="submit">Add Chore</button>
  </form>

  <table id="choreTable">
    <thead>
      <tr>
        <th>Person</th>
        <th>Sunday</th><th>Monday</th><th>Tuesday</th><th>Wednesday</th>
        <th>Thursday</th><th>Friday</th><th>Saturday</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div class="tab-content" id="weather">
  <h3>Weather</h3>
  <div id="hourly-weather"></div>
  <hr/>
  <div id="daily-weather"></div>
</div>

<script>
  // Tab handling
  function showTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('nav div').forEach(d => d.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
  }
  document.querySelector('nav div').click();

  // Chore logic
  document.getElementById('choreForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('choreName').value;
    const person = document.getElementById('chorePerson').value;
    const days = Array.from(document.querySelectorAll('input[name="day"]:checked')).map(cb => cb.value);

    const row = document.createElement('tr');
    row.innerHTML = `<td>${person}</td>` + ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map(day => {
      if (days.includes(day)) {
        return `<td><label><input type="checkbox" onchange="this.nextSibling.style.textDecoration = this.checked ? 'line-through' : 'none'"><span>${name}</span></label></td>`;
      } else {
        return `<td></td>`;
      }
    }).join('');
    document.querySelector('#choreTable tbody').appendChild(row);
    this.reset();
  });

  // Weather logic
  const apiKey = "a0df3a129b9aae7b8aab104f4eca575a";
  const lat = 30.214718, lon = -95.434769;

  fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=imperial&appid=${apiKey}`)
    .then(res => res.json())
    .then(data => {
      const hourly = data.list.slice(0, 6);
      const daily = {};

      let hourlyHTML = '<h4>Today (3-hr intervals)</h4><ul>';
      hourly.forEach(entry => {
        const time = new Date(entry.dt * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        hourlyHTML += `<li>${time}: ${entry.main.temp}°F, ${entry.weather[0].description}, Rain: ${Math.round(entry.pop * 100)}%</li>`;
      });
      hourlyHTML += '</ul>';
      document.getElementById('hourly-weather').innerHTML = hourlyHTML;

      data.list.forEach(entry => {
        const date = new Date(entry.dt * 1000).toLocaleDateString();
        if (!daily[date]) daily[date] = entry;
      });

      let dailyHTML = '<h4>Next 5 Days</h4><ul>';
      Object.values(daily).slice(0, 5).forEach(entry => {
        const date = new Date(entry.dt * 1000).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
        dailyHTML += `<li>${date}: ${entry.main.temp}°F - ${entry.weather[0].description}, Rain: ${Math.round(entry.pop * 100)}%</li>`;
      });
      dailyHTML += '</ul>';
      document.getElementById('daily-weather').innerHTML = dailyHTML;
    })
    .catch(err => {
      document.getElementById('hourly-weather').innerText = "Weather data failed to load.";
      console.error(err);
    });
</script>

</body>
</html>
